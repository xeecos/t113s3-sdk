services:
  t113-build:
    build:
      context: docker
      dockerfile: Dockerfile
      args:
        # make image APT_MIRROR=mirrors.tuna.tsinghua.edu.cn 可加速 apt
        APT_MIRROR: ${APT_MIRROR:-archive.ubuntu.com}
    image: t113-sdk-builder:latest
    container_name: t113-build
    working_dir: /work
    volumes:
      - .:/work
    environment:
      # 源码镜像: official | cn (中国网络推荐 cn, 走 TUNA/Gitee)
      - MIRROR=${MIRROR:-official}
      - KERNEL_VER=${KERNEL_VER:-}
      - UBOOT_REF=${UBOOT_REF:-}
      - BUSYBOX_REF=${BUSYBOX_REF:-}
      # 板级覆盖: make 时以环境变量形式传入, 如 KERNEL_DTS=board make kernel
      - BOARD_DTS_NAME=${BOARD_DTS_NAME:-}
      - KERNEL_DTS=${KERNEL_DTS:-}
      - KERNEL_DEFCONFIG=${KERNEL_DEFCONFIG:-}
      - UBOOT_DTS=${UBOOT_DTS:-}
      - UBOOT_DEFCONFIG=${UBOOT_DEFCONFIG:-}
      - SPI_ROOTFS=${SPI_ROOTFS:-}
      - SPI_FLASH_SIZE_MB=${SPI_FLASH_SIZE_MB:-}
    tty: true
    stdin_open: true
    # Apple Silicon 默认以 linux/arm64 原生运行(快)。
    # 需要跑全志官方 x86_64 SDK 时, 改用 :amd64 镜像并在 docker run 里加
    # --platform linux/amd64, 见 docs/vendor-sdk.md
    # platform: linux/amd64
